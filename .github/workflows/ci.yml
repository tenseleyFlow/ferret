name: ci

on:
  push:
    paths-ignore: ['**.md', 'doc/**', '.docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'doc/**', '.docs/**', 'LICENSE']
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: toolchain
        run: cc --version; make --version | head -1
      - name: deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y liburing-dev hyperfine
      - name: deps (macos)
        if: runner.os == 'macOS'
        run: brew install hyperfine || true
      - name: configure + build
        run: ./configure && make CFLAGS="-O2 -Werror"
      - name: frtdate submodule unit tests
        run: make -C deps/frtdate test CFLAGS="-O2 -Werror"
      - name: test
        run: make test
      - name: deep-tree walk (iterative + fd recycling)
        run: |
          d=$(mktemp -d)
          # 300 deep: well past the ~120 where one-fd-per-level would EMFILE under
          # ulimit -n 128 (so it exercises eviction + reopen), while the reopened
          # path stays under PATH_MAX (1024 on BSD/macOS) even with a long temp base.
          ( cd "$d" && for i in $(seq 1 300); do mkdir x && cd x || break; done )
          ref=tests/.work/ref/find-4.10.0
          # iterative walk: a deep tree must not SIGSEGV even on a small stack
          rc=0; ( ulimit -s 256; ./ferret "$d" >/dev/null 2>&1 ) || rc=$?
          [ "$rc" = 0 ] || { echo "FAIL: deep tree crashed/errored under ulimit -s 256 (rc=$rc)"; rm -rf "$d"; exit 1; }
          # fd recycling: must not EMFILE under a low fd limit; clean exit + match find
          rc=0; ( ulimit -n 128; ./ferret "$d" -type d >/tmp/o 2>/tmp/e ) || rc=$?
          fc=$(wc -l </tmp/o | tr -d ' '); gc=$( "$ref" "$d" -type d | wc -l | tr -d ' ' )
          rm -rf "$d"
          [ "$rc" = 0 ] || { echo "FAIL: deep-tree exit $rc"; head -3 /tmp/e; exit 1; }
          [ -s /tmp/e ] && { echo "FAIL: deep-tree wrote to stderr"; head -3 /tmp/e; exit 1; }
          [ "$fc" = "$gc" ] || { echo "FAIL: deep-tree dir count ferret=$fc != find=$gc"; exit 1; }
          echo "deep-tree walk OK ($gc dirs, stack+fd bounded, clean exit)"
      - name: fd-budget regression (tight ulimit + -execdir + -f*)
        # Final-audit blockers B2/B3/B4: at a tight RLIMIT_NOFILE the walk must
        # still complete and match find — for a plain walk (the fd_cap floor must
        # not exceed the usable budget), for `-execdir ... ;` (which caches no fd,
        # so eviction must stay on), and for many -f* output files (their fds must
        # be debited from the budget). None of these were covered before.
        run: |
          ref=tests/.work/ref/find-4.10.0
          d=$(mktemp -d); cur="$d"
          for i in $(seq 1 50); do mkdir -p "$cur/x" || break; echo z >"$cur/f$i"; cur="$cur/x"; done
          fail() { echo "FAIL: $1"; head -3 /tmp/e 2>/dev/null; rm -rf "$d" "$od"; exit 1; }
          # B2: plain walk, fd_cap floor band (ulimit 20 was in the old EMFILE band;
          # 16 is avoided — CI runners' inherited fds make it flaky). 32 is a sanity
          # pass where the cap is positive and eviction engages without underflow.
          for n in 20 32; do
            rc=0; ( ulimit -n $n; ./ferret "$d" -type d >/tmp/o 2>/tmp/e ) || rc=$?
            fc=$(wc -l </tmp/o|tr -d ' '); gc=$("$ref" "$d" -type d|wc -l|tr -d ' ')
            [ "$rc" = 0 ] || fail "plain walk ulimit -n $n exit $rc"
            [ -s /tmp/e ] && fail "plain walk ulimit -n $n wrote stderr"
            [ "$fc" = "$gc" ] || fail "plain walk ulimit -n $n: ferret=$fc find=$gc"
          done
          # B3: -execdir ... ; under a tight budget (eviction must stay on)
          rc=0; ( ulimit -n 32; ./ferret "$d" -type f -execdir printf '%s\n' {} ';' >/tmp/o 2>/tmp/e ) || rc=$?
          fc=$(wc -l </tmp/o|tr -d ' '); gc=$("$ref" "$d" -type f -execdir printf '%s\n' {} ';' 2>/dev/null|wc -l|tr -d ' ')
          [ "$rc" = 0 ] || fail "-execdir ; ulimit -n 32 exit $rc"
          [ -s /tmp/e ] && fail "-execdir ; wrote stderr"
          [ "$fc" = "$gc" ] || fail "-execdir ;: ferret=$fc find=$gc"
          # B4: many -f* output files debited from the budget (all must be complete)
          od=$(mktemp -d); fa=""
          for i in $(seq 1 24); do fa="$fa -fprint $od/o$i"; done
          rc=0; ( ulimit -n 64; ./ferret "$d" -type f $fa >/dev/null 2>/tmp/e ) || rc=$?
          gc=$("$ref" "$d" -type f|wc -l|tr -d ' ')
          [ "$rc" = 0 ] || fail "-f* x24 ulimit -n 64 exit $rc"
          [ -s /tmp/e ] && fail "-f* x24 wrote stderr"
          for i in $(seq 1 24); do c=$(wc -l <"$od/o$i" 2>/dev/null|tr -d ' '); [ "$c" = "$gc" ] || fail "-f* file o$i truncated: $c != $gc"; done
          rm -rf "$d" "$od"
          echo "fd-budget regression OK (plain/16-32, -execdir ;, 24x -f*; all match find, clean exit)"
      - name: io_uring parity (linux)
        if: runner.os == 'Linux'
        run: |
          if grep -q 'FRT_HAS_LIBURING = 1' config.mk; then FRT_IO=uring make test; fi
      - name: io_uring actually engages (linux)
        if: runner.os == 'Linux'
        run: |
          grep -q 'FRT_HAS_LIBURING = 1' config.mk || { echo "no liburing; skip"; exit 0; }
          sudo apt-get install -y strace
          d=$(mktemp -d); for i in $(seq 1 50); do echo x >"$d/f$i"; done
          # -size forces a stat with no -name filter, and 50 entries clear the
          # batch floor, so the io_uring path must fire if it engaged at all.
          strace -f -e trace=io_uring_setup,openat -o "$d/trace" \
            env FRT_IO=uring ./ferret "$d" -size +0c >/dev/null 2>&1 || true
          if ! grep -q openat "$d/trace"; then
            echo "strace saw no syscalls (ptrace restricted?); cannot verify — skipping"; exit 0
          fi
          if grep -q io_uring_setup "$d/trace"; then
            echo "io_uring engaged ($(grep -c io_uring_setup "$d/trace") setup call(s))"
          else
            echo "FAIL: FRT_IO=uring issued no io_uring syscalls — silent fallback to the pool"
            exit 1
          fi
      - name: sanitizer build
        run: make debug
      - name: bench
        # Shared CI runners jitter the mean upward, especially on the many-tiny-dir
        # "wide" shapes that are per-dir-syscall-bound (ferret's getdents/buffer edge
        # is smallest there). Gate on the best-of-30 min (true compute, jitter-robust)
        # with a 3% band. Substantive shapes clear it by 25-85%; real regressions
        # (tens of %) still fail. Local 'make bench' keeps the strict auto metric.
        run: FRT_PERF_METRIC=min FRT_PERF_MARGIN=0.97 make bench
      - name: io_uring vs pool bench (linux, informational)
        if: runner.os == 'Linux'
        run: sh bench/uring.sh || true

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg install -y gmake hyperfine || true
          run: |
            ./configure
            gmake CFLAGS="-O2 -Werror"
            gmake test
            gmake bench || true   # VM timing too noisy to gate

  musl:
    runs-on: ubuntu-latest
    env:
      CC: musl-gcc
      FRT_TEST_SANITIZE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: configure + build
        run: ./configure && make CFLAGS="-O2 -Werror"
      - name: test
        run: make test
